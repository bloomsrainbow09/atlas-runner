# The Atlas backend, on a machine GitHub takes away every six hours.
#
# GitHub kills a workflow run at six hours, hard. So this run starts its own
# replacement before it dies, and the replacement does the same. An always-on
# EC2 instance relays a fixed public port to whichever runner is currently
# alive, so the address never changes and nothing downstream has to know that
# the machine behind it is replaced four times a day.
#
# What makes this affordable: this repository is public, so Actions minutes are
# unlimited. A perpetual runner burns about 720 hours a month, which on a
# private repository would exhaust the 2,000-minute free allowance in 33 hours.
# The application itself is private and is checked out with a token.
#
# What makes it survivable: nothing important lives on the runner. The lake is
# on Drive, the password hash and token secret are repository secrets,
# and the only local state is a 6.2 GiB cache of the two tiers that must be
# local to be fast. A wipe costs four minutes of re-warming, not any data.
#
# The re-dispatch at the end is conditional on the worker having stayed up more
# than twenty minutes. Without that brake, a run that dies in its first minute
# re-dispatches immediately and a broken state becomes a dispatch loop bounded
# only by GitHub's abuse detection -- which is a real finding from this
# account's own 2026-09-12 review of its other perpetual runner, not a
# hypothetical.

name: atlas

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run was started
        required: false
        default: manual
  repository_dispatch:
    types: [atlas-restart]
  # The primary trigger, and deliberately the only automatic one.
  #
  # Every four hours, while a run serves for 5 h 40 m, so successive runs
  # overlap by 1 h 40 m and there is no gap to cover. An earlier design had
  # each run dispatch its own successor, which needed a token with Actions
  # write on this repository and -- as the 2026-09-12 review found as B7 --
  # could become a dispatch loop bounded only by GitHub's abuse detection.
  # A cron cannot loop, and needs no credential at all.
  #
  # The cost is that GitHub may delay a scheduled run under load. The overlap
  # absorbs that; two consecutive misses would leave a gap, which the
  # frontend's "backend starting" state covers and `workflow_dispatch`
  # above fixes in one click.
  schedule:
    - cron: '17 */4 * * *'

# Deliberately no `concurrency` group.
#
# Runs must be allowed to overlap: cron fires every four hours, a run serves for
# 5 h 40 m, and the overlap is what makes the handover seamless. The new backend
# warms its 18 GiB, joins the mesh, and only then does atlas-update-relay move
# the relay onto it -- while the old one is still answering.
#
# A group here (`cancel-in-progress: false`) queues the new run instead, so it
# starts only after its predecessor exits and the gap becomes the whole startup
# time, about eight minutes of 502s every four hours. That is what this file did
# until it was watched doing it.
#
# `cancel-in-progress: true` would be worse again: every cron tick would kill a
# healthy backend mid-request.
#
# Nothing can run away: cron is fixed, and the only other trigger is a manual
# dispatch.

permissions:
  contents: read

env:
  ATLAS_HOME: /opt/atlas
  # The rclone mount. people/ and children/ are read from here; the hot
  # tiers are copied to $ATLAS_HOME/lake instead.
  ATLAS_MOUNT: /mnt/atlas-drive
  ATLAS_PORT: '8787'
  # 5 h 40 m. GitHub kills at 6 h; the successor is dispatched at 5 h 30 m, so
  # there is a ten-minute overlap in which the relay can move across before
  # this one exits.
  SERVE_SECONDS: '20400'

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ------------------------------------------------------------------ #
      - name: Reclaim disk
        # The runner ships with ~14 GB free on / and about 45 GB of
        # preinstalled toolchains nobody here uses. The local tier is 6.2 GiB
        # and the Drive VFS cache is 8 GiB, so 14 GB is not enough and the
        # failure would be a disk-full error twenty minutes into warming.
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1
          free -g | head -2

      - name: Check out the application
        uses: actions/checkout@v4
        with:
          repository: prarthanadoshi7/atlas-search
          # A read-only deploy key on atlas-search, not a PAT. One repository,
          # read-only, and it can do nothing else -- where a fine-grained PAT is
          # still an account credential, and has to be minted by hand in a
          # browser. This one is created through the API.
          ssh-key: ${{ secrets.ATLAS_REPO_DEPLOY_KEY }}
          path: app
          # One commit. The history is 150 MB of screenshots and docs that the
          # backend does not need.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install the backend
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -c "import duckdb; print('duckdb', duckdb.__version__)"

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -1

      # ------------------------------------------------------------------ #
      - name: Write the environment
        # Mode 600 and outside the workspace, so nothing in the checkout can
        # read it and no step can accidentally upload it as an artifact.
        env:
          GD_CLIENT_ID: ${{ secrets.ATLAS_GDRIVE_CLIENT_ID }}
          GD_CLIENT_SECRET: ${{ secrets.ATLAS_GDRIVE_CLIENT_SECRET }}
          GD_TOKEN: ${{ secrets.ATLAS_GDRIVE_REFRESH_TOKEN }}
          GD_FOLDER: ${{ secrets.ATLAS_DRIVE_FOLDER_ID }}
          PASSWORD_HASH: ${{ secrets.ATLAS_PASSWORD_HASH }}
          TOKEN_SECRET: ${{ secrets.ATLAS_TOKEN_SECRET }}
          ALLOWED_ORIGINS: ${{ secrets.ATLAS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          sudo mkdir -p "$ATLAS_HOME"/{lake,scratch,logs,vfs-cache}
          sudo chown -R "$USER" "$ATLAS_HOME"

          # Fail here, loudly, rather than three steps later with an rclone
          # error that reads like a network problem.
          missing=()
          for v in GD_CLIENT_ID GD_CLIENT_SECRET GD_TOKEN GD_FOLDER                    PASSWORD_HASH TOKEN_SECRET; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if (( ${#missing[@]} )); then
            echo "::error::these repository secrets are not set: ${missing[*]}"
            echo "See docs/DEPLOYMENT.md section 7." >&2
            exit 1
          fi

          umask 077
          # Every value is single-quoted, and that is not a style choice. The
          # scrypt hash uses $ as its field separator -- scrypt$32768$8$1$...
          # -- so an unquoted value is re-expanded when a later step sources
          # this file, and a 114-character hash arrives as 41 characters of
          # nonsense. The symptom is a password that is simply never accepted.
          cat > "$ATLAS_HOME/.env" <<EOF
          ATLAS_AGG_ROOT='$ATLAS_HOME/lake/agg'
          ATLAS_DIMS_ROOT='$ATLAS_HOME/lake/dims'
          ATLAS_IDX_ROOT='$ATLAS_HOME/lake/idx'
          ATLAS_MANIFEST_ROOT='$ATLAS_HOME/lake/_manifest'
          ATLAS_PEOPLE_ROOT='$ATLAS_MOUNT/people'
          ATLAS_CHILDREN_ROOT='$ATLAS_MOUNT/children'
          ATLAS_SCRATCH='$ATLAS_HOME/scratch'
          ATLAS_DUCK_MEMORY='10GB'
          ATLAS_DUCK_THREADS='4'
          ATLAS_PASSWORD_HASH='$PASSWORD_HASH'
          ATLAS_TOKEN_SECRET='$TOKEN_SECRET'
          ATLAS_ALLOWED_ORIGINS='${ALLOWED_ORIGINS:-https://bloomsrainbow09.github.io}'
          EOF
          chmod 600 "$ATLAS_HOME/.env"

          # Prove the hash survived the round trip, rather than discovering it
          # at the login screen.
          ( set -a; . "$ATLAS_HOME/.env"; set +a
            n=$(printf '%s' "$ATLAS_PASSWORD_HASH" | tr -cd '$' | wc -c)
            echo "password hash: ${#ATLAS_PASSWORD_HASH} chars, $n separators"
            if [ "$n" != "5" ]; then
              echo "::error::the password hash lost fields to shell expansion"
              exit 1
            fi )

          # rclone's config is built line by line with printf. A heredoc here
          # is what broke the previous attempt: indented, it leaves leading
          # whitespace in every value. printf also keeps the secrets off the
          # command line, so they never appear in a process listing.
          mkdir -p ~/.config/rclone
          CONF=~/.config/rclone/rclone.conf
          {
            echo "[atlas-drive]"
            echo "type = drive"
            echo "scope = drive"
            printf 'client_id = %s\n' "$GD_CLIENT_ID"
            printf 'client_secret = %s\n' "$GD_CLIENT_SECRET"
            printf 'root_folder_id = %s\n' "$GD_FOLDER"
            # access_token is a non-empty placeholder on purpose. With an
            # empty string -- or with the key absent -- oauth2 treats the
            # whole token as unset and never constructs the refresher, and
            # rclone reports "token expired and there is no refresh token"
            # even though the refresh token is right there in the file.
            # Verified three ways on the workstation: "" fails, absent
            # fails, any non-empty value works.
            # The expiry is deliberately in the past, so rclone refreshes on
            # first use instead of trusting an access token that was baked
            # into a repository secret at some unknown time.
            printf 'token = {"access_token":"expired","token_type":"Bearer","refresh_token":"%s","expiry":"2000-01-01T00:00:00Z"}\n' "$GD_TOKEN"
          } > "$CONF"
          chmod 600 "$CONF"

          echo "remotes:"
          rclone listremotes | sed 's/^/  /'

          # Assert the refresh token is actually in the file, here, where the
          # message is readable -- not in the warm step as a copy that finds
          # nothing.
          if ! grep -q 'refresh_token":"[^"]' "$CONF"; then
            echo "::error::the rclone config has no refresh token"
            exit 1
          fi
          echo "  refresh token present (${#GD_TOKEN} chars)"

          # And prove the credential works against Google before going on.
          rclone about atlas-drive: | sed 's/^/  /'

      # ------------------------------------------------------------------ #
      - name: Warm the hot tiers onto local disk
        # agg/ is 865 KB and answers every facet question; dims/ is 6.2 GiB and
        # powers every typeahead keystroke; idx/ is 11.8 GiB and backs every
        # skill and school filter. All three must be local: paying 100-300 ms
        # of network for a number that is already summed is the same mistake as
        # scanning 107 million rows to count them, which is the whole reason
        # this lake has an agg/ at all.
        #
        # 18.0 GiB on a runner with ~59 GB usable, once per cycle. Ordered
        # smallest first so a slow pull still leaves facets and typeahead
        # working while idx/ is still arriving.
        run: |
          set -uo pipefail
          . "$ATLAS_HOME/.env"
          t0=$SECONDS
          got=""
          missing=""
          for tier in agg _manifest dims idx; do
            echo "::group::pulling $tier"
            if rclone copy "atlas-drive:$tier" "$ATLAS_HOME/lake/$tier" \
                 --checksum --transfers 16 --checkers 32 \
                 --drive-chunk-size 64M --stats 30s -v; then
              got="$got $tier"
            else
              # Not fatal. A tier that is absent from Drive -- because the
              # first upload has not reached it yet, or because it was never
              # shipped -- costs that tier's endpoints and nothing else: the
              # backend answers 503 naming it, and the UI says which part is
              # missing. Aborting here would instead cost the whole service.
              echo "::warning::$tier is not on Drive yet; the endpoints that"\
                   "need it will answer 503 until it is"
              missing="$missing $tier"
            fi
            echo "::endgroup::"
          done

          echo "warmed in $((SECONDS - t0))s"
          echo "  present:$got"
          [ -n "$missing" ] && echo "  missing:$missing"
          du -sh "$ATLAS_HOME/lake"/* 2>/dev/null | sed 's/^/  /' || true

          # The one genuinely fatal case: nothing at all arrived. agg is 865 KB
          # and is uploaded first, so if even that is absent the root is wrong,
          # not merely incomplete -- and every later step would fail in a less
          # obvious way.
          if [ -z "$got" ]; then
            echo "::error::no tier could be read from atlas-drive: --"\
                 "check ATLAS_DRIVE_FOLDER_ID"
            exit 1
          fi

      - name: Mount the cold tiers
        # people/ (39.9 GiB) and children/ (58.5 GiB) are too big to copy and
        # are read a few row groups at a time, so they come off a VFS-cached
        # mount instead. children/ is in NON_FATAL_TIERS: a stalled mount costs
        # the detail page and nothing else.
        run: |
          set -euo pipefail
          . "$ATLAS_HOME/.env"
          sudo mkdir -p "$ATLAS_MOUNT"
          sudo chown -R "$USER" "$(dirname "$ATLAS_MOUNT")"
          # fuse needs this for --allow-other.
          sudo sed -i 's/^#user_allow_other/user_allow_other/' /etc/fuse.conf || true
          # Invoked through bash rather than executed. The executable bit
          # survives neither a Windows checkout nor the contents API that
          # publishes this workflow, and the failure is a bare
          # "Permission denied" with exit 126.
          bash app/deploy/runner/mount-drive.sh "$ATLAS_MOUNT"

      - name: Start the backend
        working-directory: app
        run: |
          set -euo pipefail
          set -a; . "$ATLAS_HOME/.env"; set +a
          export PYTHONPATH="$PWD:$PWD/database"
          nohup python -m uvicorn backend.app.main:app \
            --host 0.0.0.0 --port "$ATLAS_PORT" \
            --workers 1 --timeout-keep-alive 75 \
            > "$ATLAS_HOME/logs/uvicorn.log" 2>&1 &
          echo $! > "$ATLAS_HOME/uvicorn.pid"

          # Wait for the app to answer at all. That is the fatal condition:
          # no response means uvicorn died, and the log says why.
          body=""
          for i in $(seq 1 90); do
            body=$(curl -fsS "http://127.0.0.1:$ATLAS_PORT/api/health" 2>/dev/null || true)
            if [[ -n "$body" ]]; then
              echo "answered after ${i}s"
              break
            fi
            sleep 1
          done

          if [[ -z "$body" ]]; then
            echo "::error::the backend never answered /api/health in 90s"
            tail -60 "$ATLAS_HOME/logs/uvicorn.log"
            exit 1
          fi

          jq '{ok, detail, people_rows, auth, tiers}' <<<"$body"

          # A lake that is not fully readable is reported, not fatal. Every
          # endpoint whose tier is present still works, and the rest answer 503
          # naming the tier -- which is strictly better than answering nothing.
          if [[ "$(jq -r '.ok' <<<"$body")" != "true" ]]; then
            echo "::warning::serving degraded: $(jq -r '.detail // "some tier is unreadable"' <<<"$body")"
          fi

          # The gate, though, is not negotiable. An ungated backend on a public
          # address exposes 400 million personal records, so a missing password
          # is fatal here even though the app would happily run without one.
          if [[ "$(jq -r '.auth' <<<"$body")" != "true" ]]; then
            echo "::error::the password gate is OFF -- refusing to serve"
            exit 1
          fi
          echo "password gate: on"

      - name: Confirm the gate is on
        # A deployed instance that is quietly open looks exactly like one that
        # is not. This is the cheapest possible check and it runs every cycle.
        run: |
          set -euo pipefail
          h=$(curl -fsS "http://127.0.0.1:$ATLAS_PORT/api/health")
          auth=$(jq -r '.auth' <<<"$h")
          if [[ "$auth" != "true" ]]; then
            echo "::error::the password gate is not configured -- refusing to serve"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 "http://127.0.0.1:$ATLAS_PORT/api/geo")
          if [[ "$code" != "401" ]]; then
            echo "::error::/api/geo returned $code without a token, expected 401"
            exit 1
          fi
          echo "gate on: /api/geo is 401 without a token"

      # ------------------------------------------------------------------ #
      - name: Join the mesh
        env:
          TS_AUTHKEY: ${{ secrets.ATLAS_TAILSCALE_AUTHKEY }}
          HS_URL: ${{ secrets.ATLAS_HEADSCALE_URL }}
          HS_CA: ${{ secrets.ATLAS_HEADSCALE_CA_CERT }}
        # Deliberately a copy of the join in the Automation project's
        # n8n-linux.yml, which has run against this same Headscale since May.
        # Earlier attempts to improve on it -- a hand-started tailscaled in
        # userspace-networking mode, and --advertise-tags -- produced a step
        # that hung indefinitely with nothing registered on the control server.
        run: |
          set -euo pipefail
          if [[ -z "${TS_AUTHKEY:-}" || -z "${HS_URL:-}" ]]; then
            echo "::warning::no mesh credentials; the backend is up but the"\
                 "EC2 relay cannot reach it (docs/DEPLOYMENT.md section 9)."
            exit 0
          fi

          # The control server uses a self-signed CA on purpose: both ends are
          # ours, and a public certificate would need a domain. Trust it before
          # tailscaled starts, or the first connection fails and it backs off.
          if [[ -n "${HS_CA:-}" ]]; then
            echo "$HS_CA" | sudo tee /usr/local/share/ca-certificates/headscale.crt >/dev/null
            sudo update-ca-certificates
          fi

          # The installer starts tailscaled as a service. Do not start a second
          # one by hand: `tailscale up` would then be talking to a different
          # daemon than the one holding the flags.
          curl -fsSL https://tailscale.com/install.sh | sudo sh

          # No --advertise-tags: this Headscale defines no ACL tags, and an
          # unknown tag is rejected. The outer `timeout` is the real protection
          # -- without it a control server that cannot be reached leaves this
          # step running until the job's own 350-minute limit.
          if ! sudo timeout 180 tailscale up \
                 --login-server="$HS_URL" \
                 --authkey="$TS_AUTHKEY" \
                 --hostname=atlas-runner \
                 --accept-dns=false; then
            echo "::warning::could not join the mesh; the backend is up but"\
                 "only reachable from inside this job"
            sudo tailscale status 2>&1 | head -10 || true
            tail -30 /var/log/syslog 2>/dev/null | grep -i tailscale | tail -10 || true
            exit 0
          fi

          ip=""
          for i in $(seq 1 30); do
            ip=$(sudo tailscale ip -4 2>/dev/null || true)
            [ -n "$ip" ] && break
            sleep 3
          done
          if [ -z "$ip" ]; then
            echo "::warning::joined but no mesh IP was assigned"
            exit 0
          fi
          echo "mesh ip: $ip  (hostname atlas-runner)"
          echo "ATLAS_MESH_IP=$ip" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ #
      - name: Serve
        id: serve
        run: |
          set -uo pipefail
          started=$SECONDS
          echo "serving for $SERVE_SECONDS seconds"

          while (( SECONDS - started < SERVE_SECONDS )); do
            up=$(( SECONDS - started ))

            # No handover dispatch. The cron above fires every four hours while
            # this serves for 5 h 40 m, so the successor is already running and
            # on the mesh before this run exits, and atlas-update-relay on the
            # EC2 moves the relay to the newer of the two within two minutes.
            # Nothing in this loop needs a GitHub token.

            # A backend that has died must not keep the slot: exiting lets the
            # EC2 watchdog start a replacement within five minutes instead of
            # waiting out the remaining hours.
            if ! curl -fsS --max-time 20 \
                 "http://127.0.0.1:$ATLAS_PORT/api/health" >/dev/null; then
              echo "::error::the backend stopped answering after ${up}s"
              tail -40 "$ATLAS_HOME/logs/uvicorn.log"
              echo "uptime=$up" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            if (( up % 600 < 60 )); then
              c=$(curl -fsS "http://127.0.0.1:$ATLAS_PORT/api/cache" \
                  | jq -r '[.caches[] | "\(.name)=\(.size)"] | join(" ")' \
                  2>/dev/null || echo "-")
              printf 'up %5ds  disk %s  cache %s\n' \
                "$up" "$(df -h / | awk 'NR==2{print $4}')" "$c"
            fi
            sleep 60
          done
          echo "uptime=$(( SECONDS - started ))" >> "$GITHUB_OUTPUT"
          echo "served $(( (SECONDS - started) / 60 )) minutes"

      # ------------------------------------------------------------------ #
      - name: Stop cleanly
        if: always()
        run: |
          set +e
          [[ -f "$ATLAS_HOME/uvicorn.pid" ]] && kill "$(cat "$ATLAS_HOME/uvicorn.pid")"
          . "$ATLAS_HOME/.env" 2>/dev/null
          bash app/deploy/runner/mount-drive.sh "$ATLAS_MOUNT" --unmount
          sudo tailscale logout 2>/dev/null
          tail -30 "$ATLAS_HOME/logs/uvicorn.log" 2>/dev/null
          exit 0
